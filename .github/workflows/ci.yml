name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        # Windows 与 Linux 都跑：项目含 Windows 专属代码路径
        # （subprocess creationflags、icacls、powershell.exe）。
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 与 pyproject 的 requires-python 一致；PEP 701 f-string 已改写，3.11 可解析。
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (ruff)
        # ruff 不在 requirements.txt 中（该文件由另一处维护），故在 CI 内单独安装。
        # 规则集见 pyproject.toml [tool.ruff.lint]：只启用真实错误类规则，
        # 全默认规则集存在 1378 处既存违规，不可作为门禁。
        run: |
          pip install ruff
          ruff check backend/ tests/ conftest.py

      - name: Run tests
        # 测试必须离线通过：conftest.py 将 AURORA_HOME 隔离到 tmp_path，
        # 无网络调用；若在无网环境失败，应作为真实缺陷上报而非跳过。
        run: python -m pytest tests/ -q

  desktop:
    name: desktop (vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop deps
        working-directory: desktop
        run: npm ci

      - name: Type-check main process
        working-directory: desktop
        run: npx tsc -p tsconfig.main.json --noEmit

      - name: Test (vitest)
        # 桌面端此前测试数为 0；这里守住新增的状态机/会话逻辑基线。
        working-directory: desktop
        run: npm run test
